name: Test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The committed Manifest.toml is pinned to one Julia version (see its
      # own julia_version field) for local-dev reproducibility; resolve fresh
      # in CI instead of instantiating it, so a future Julia bump on the dev
      # machine can't silently break this job.
      - run: rm -f Manifest.toml

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"   # latest stable. NOT matrixed against "1.10": the
          # Project.toml declares `julia = "1.10"` compat, but its stdlib
          # compat bounds (Dates/Logging/Sockets/UUIDs = "1.11.0") only allow
          # the stdlib versions Julia 1.11+ ships -- 1.10's sysimage carries
          # older ones it cannot substitute. The declared minimum does not
          # currently install on 1.10; that is a Project.toml decision for
          # the maintainer, not something to paper over here.

      - uses: julia-actions/cache@v2

      - uses: julia-actions/julia-buildpkg@v1

      - uses: julia-actions/julia-runtest@v1
