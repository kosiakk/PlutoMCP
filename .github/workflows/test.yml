name: Test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.10", "1"]
    steps:
      - uses: actions/checkout@v4

      # The committed Manifest.toml is pinned to one Julia version (see its
      # own julia_version field) for local-dev reproducibility. Instantiating
      # it under a DIFFERENT version in the matrix fails outright -- JLL
      # packages resolve different artifacts per Julia version, and Pkg
      # refuses a manifest whose pinned artifacts it cannot locate. Each job
      # resolves its own from Project.toml's compat bounds instead.
      - run: rm -f Manifest.toml

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2

      - uses: julia-actions/julia-buildpkg@v1

      - uses: julia-actions/julia-runtest@v1
